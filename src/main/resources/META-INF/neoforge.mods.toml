modLoader = "javafml"
loaderVersion = "${neoforge_loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/AlmuraDev/mocreaturesdev/issues"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
displayURL = "https://github.com/AlmuraDev/mocreaturesdev"
logoFile = "moclogo.png"
credits = """Original mod by Dr. Zhark, BlockDaddy and Bloodshot. 1.20.1 Nostalgia Edition by multision and TheidenHD. Community fixes: Lollizaczek/Lollizak (horse animation and zebra shuffle); Dinocraft-cz/Vaniron (zebra-fix integration); ItsFadedMaybe/Faded (elephant riding); Clickibait/ClickLarp and Pug (legacy models, shark, pet persistence, and elephant fixes). Full attribution and source links: CREDITS.md inside this mod."""
authors = "${mod_authors}"
description = '''${mod_description}'''

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"
